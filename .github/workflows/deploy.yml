name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build on GitHub
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: "--max_old_space_size=6144"
        run: |
          npm ci
          npm run build

      - name: Tar files for deployment
        run: tar -czf deploy.tar.gz dist package.json package-lock.json prisma

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          source: "deploy.tar.gz"
          target: "/root/propnexai-main-server"
          overwrite: true

      - name: Restart PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /root/propnexai-main-server
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            npm ci --omit=dev
            npx prisma generate
            pm2 restart propnexai-main-server || pm2 start npm --name "propnexai-main-server" -- run start:prod
            pm2 save
            sleep 3
            pm2 logs --nostream --lines 50
