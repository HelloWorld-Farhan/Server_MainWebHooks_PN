enum PhoneNumberSortField {
  CREATED_AT
  UPDATED_AT
  LAST_ACTIVITY_AT
  NUMBER
  INBOUND_CALLS_COUNT
  OUTBOUND_CALLS_COUNT
}

enum SortDirection {
  ASC
  DESC
}

input PhoneNumberFilter {
  """Exact match on stored number"""
  number: String
  """Substring match on number"""
  numberContains: String
  """Substring match on label"""
  labelContains: String
  """Free-text search across number + label"""
  search: String
  provider: String
  status: String
  inboundAgentId: ID
  outboundAgentId: ID
  """true = inbound agent assigned; false = unassigned"""
  hasInboundAgent: Boolean
  """true = outbound agent assigned; false = unassigned"""
  hasOutboundAgent: Boolean
  """Filter numbers assigned to a telephony channel index"""
  channelIndex: Int
  """Only numbers that have (or lack) a channel assignment"""
  hasChannelAssignment: Boolean
  createdFrom: String
  createdTo: String
  lastActivityFrom: String
  lastActivityTo: String
  ids: [ID!]
}

input PhoneNumberSort {
  field: PhoneNumberSortField!
  direction: SortDirection! = DESC
}

type PhoneNumberEdge {
  node: PhoneNumber!
  cursor: String!
}

type PhoneNumberConnection {
  edges: [PhoneNumberEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PhoneNumbersQueries {
  list(filter: PhoneNumberFilter, sort: PhoneNumberSort): [PhoneNumber!]!
  connection(
    first: Int
    after: String
    filter: PhoneNumberFilter
    sort: PhoneNumberSort
  ): PhoneNumberConnection!
  byId(id: ID!): PhoneNumber
}

type PhoneNumber {
  id: ID!
  number: String!
  label: String
  provider: String!
  status: String!
  inboundAgentId: ID
  outboundAgentId: ID
  agentUrl: String
  channels: Int
  inboundAgent: AiAgent
  outboundAgent: AiAgent
  inboundCallsCount: Int!
  outboundCallsCount: Int!
  lastActivityAt: String
  createdAt: String!
  updatedAt: String!
}

input CreatePhoneNumberInput {
  number: String!
  provider: String!
  label: String
  inboundAgentId: ID
  outboundAgentId: ID
  agentUrl: String
  channels: Int
}

input UpdatePhoneNumberInput {
  label: String
  status: String
  inboundAgentId: ID
  outboundAgentId: ID
  agentUrl: String
  channels: Int
}

type PhoneNumbersMutations {
  create(input: CreatePhoneNumberInput!): PhoneNumber!
  update(id: ID!, input: UpdatePhoneNumberInput!): PhoneNumber!
}

