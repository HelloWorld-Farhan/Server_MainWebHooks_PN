type Campaign {
  id: ID!
  name: String!
  status: CampaignStatus!
  address: String
  phone: String
  email: String
  notes: String
  customFields: JSON
  aiEnabled: Boolean!
  systemPrompt: String
  aiConfig: JSON
  contactsCount: Int!
  callLogsCount: Int!
  documentsCount: Int!
  agentsCount: Int!
  lastActivityAt: String
  createdAt: String!
  updatedAt: String!
  invitationEmailSent: Boolean
  invitation: CampaignInvitation
}

type CampaignEdge {
  node: Campaign!
  cursor: String!
}

type CampaignConnection {
  edges: [CampaignEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CampaignContact {
  id: ID!
  firstName: String
  lastName: String
  email: String
  phone: String
  createdAt: String
}

type CampaignCallLog {
  id: ID!
  direction: String!
  status: String!
  durationSeconds: Int!
  startedAt: String!
  leadPhone: String
  leadName: String
}

type CampaignDocument {
  id: ID!
  name: String!
  url: String!
  mimeType: String
  sizeBytes: Int
  createdAt: String!
}

type CampaignActivity {
  id: ID!
  type: String!
  summary: String!
  metadata: JSON
  createdAt: String!
}

input CampaignFilter {
  search: String
  status: CampaignStatus
  aiEnabled: Boolean
}

input CreateCampaignInput {
  name: String!
  status: CampaignStatus
  address: String
  phone: String
  email: String
  notes: String
  customFields: JSON
  aiEnabled: Boolean
  systemPrompt: String
  aiConfig: JSON
}

input UpdateCampaignInput {
  name: String
  status: CampaignStatus
  address: String
  phone: String
  email: String
  notes: String
  customFields: JSON
}

input UpdateCampaignAiInput {
  aiEnabled: Boolean
  systemPrompt: String
  aiConfig: JSON
}

enum CampaignBulkAction {
  ENABLE_AI
  DISABLE_AI
  UPDATE_PROMPT
  CHANGE_STATUS
  ARCHIVE
}

input BulkCampaignUpdateInput {
  ids: [ID!]!
  action: CampaignBulkAction!
  systemPrompt: String
  status: CampaignStatus
}

type BulkCampaignUpdateResult {
  updated: Int!
}

type CampaignsQueries {
  connection(first: Int, after: String, filter: CampaignFilter): CampaignConnection!
  byId(id: ID!): Campaign
  contacts(campaignId: ID!, first: Int, after: String): [CampaignContact!]!
  callLogs(campaignId: ID!, first: Int, after: String): [CampaignCallLog!]!
  documents(campaignId: ID!): [CampaignDocument!]!
  activities(campaignId: ID!, limit: Int): [CampaignActivity!]!
  agents(campaignId: ID!): [AiAgent!]!
}

type CampaignsMutations {
  create(input: CreateCampaignInput!): Campaign!
  update(id: ID!, input: UpdateCampaignInput!): Campaign!
  updateAi(id: ID!, input: UpdateCampaignAiInput!): Campaign!
  bulkUpdate(input: BulkCampaignUpdateInput!): BulkCampaignUpdateResult!
  archive(id: ID!): Campaign!
  resendInvitation(campaignId: ID!): Campaign!
  cancelInvitation(campaignId: ID!): Campaign!
  generateNewInvitation(campaignId: ID!): Campaign!
}

enum CampaignInvitationStatus {
  PENDING
  ACCEPTED
  EXPIRED
  CANCELLED
}

type CampaignInvitation {
  id: ID!
  email: String!
  token: String!
  status: CampaignInvitationStatus!
  createdAt: String!
  updatedAt: String!
  sentAt: String!
  acceptedAt: String
  expiresAt: String!
}
