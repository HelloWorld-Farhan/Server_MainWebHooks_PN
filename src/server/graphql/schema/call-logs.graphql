input CallLogFilter {
  direction: CallDirection
  status: CallStatus
  aiAgentId: ID
  phoneNumberId: ID
  assignedUserId: ID
  dateFrom: String
  dateTo: String
  search: String
}

type CallLogsQueries {
  recent(limit: Int): [CallLog!]!
  connection(first: Int, after: String, filter: CallLogFilter): CallLogConnection!
  detail(id: ID!): CallLogDetail
}

type CallLogsMutations {
  recordCallCompleted(callLogId: ID!): Boolean!
  updateOutcome(id: ID!, outcome: String!, reactivationPlan: JSON): CallLogDetail
  addInternalNote(callLogId: ID!, content: String!): CallInternalNote!
  updateInternalNote(id: ID!, content: String!): CallInternalNote!
  deleteInternalNote(id: ID!): Boolean!
}

type CallInternalNote {
  id: ID!
  content: String!
  createdAt: String!
  updatedAt: String!
  author: CallInternalNoteAuthor!
}

type CallInternalNoteAuthor {
  id: ID!
  name: String!
  email: String!
}

type CallLog {
  id: ID!
  direction: CallDirection!
  status: CallStatus!
  outcome: String
  startedAt: String!
  durationSeconds: Int!
  recordingUrl: String
  transcriptUrl: String
  cost: Float
  creditsUsed: Int
  provider: String
  aiSummary: JSON
  sentiment: JSON
  leadId: ID
  aiAgentId: ID
  phoneNumberId: ID
  lead: Lead
  aiAgent: AiAgent
  phoneNumber: PhoneNumber
}

type CallLogDetail {
  id: ID!
  direction: CallDirection!
  status: CallStatus!
  outcome: String
  startedAt: String!
  durationSeconds: Int!
  recordingUrl: String
  cost: Float
  creditsUsed: Int
  provider: String
  aiSummary: JSON
  sentiment: JSON
  engagement: JSON
  reactivationPlan: JSON
  lead: Lead
  aiAgent: AiAgent
  phoneNumber: PhoneNumber
  transcript: CallTranscript
  internalNotes: [CallInternalNote!]!
}

type CallTranscript {
  id: ID!
  fullText: String
  segments: JSON
}

type CallLogEdge {
  node: CallLog!
  cursor: String!
}

type CallLogConnection {
  edges: [CallLogEdge!]!
  pageInfo: PageInfo!
}
